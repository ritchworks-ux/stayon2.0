name: stayon
description: "Never miss what matters."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State & routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Backend
  supabase_flutter: ^2.5.6
  firebase_core: ^3.8.0
  firebase_storage: ^12.3.0
  cloud_firestore: ^5.5.0

  # Models & codegen
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Local DB
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Storage / secure
  flutter_secure_storage: ^9.2.2

  # Attachments
  image_picker: ^1.1.2
  file_picker: ^8.0.6
  flutter_image_compress: ^2.3.0
  cached_network_image: ^3.4.0
  pdfx: ^2.6.0

  # OCR-lite (on-device)
  google_mlkit_text_recognition: ^0.13.1

  # Barcode scanning
  mobile_scanner: ^5.2.0
  permission_handler: ^12.0.1

  # API clients
  http: ^1.1.0

  # Locale
  intl: ^0.19.0

  # Crash reporting
  sentry_flutter: ^8.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  fonts:
    - family: NunitoSans
      fonts:
        - asset: assets/fonts/NunitoSans-Variable.ttf
          weight: 300
        - asset: assets/fonts/NunitoSans-Variable.ttf
          weight: 400
        - asset: assets/fonts/NunitoSans-Variable.ttf
          weight: 600
        - asset: assets/fonts/NunitoSans-Variable.ttf
          weight: 700
        - asset: assets/fonts/NunitoSans-Variable.ttf
          weight: 800
        - asset: assets/fonts/NunitoSans-Variable.ttf
          weight: 900
        - asset: assets/fonts/NunitoSans-Italic-Variable.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/NunitoSans-Italic-Variable.ttf
          weight: 700
          style: italic
